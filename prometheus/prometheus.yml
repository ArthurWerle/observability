global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus itself.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Per-container CPU / memory / network / disk / restarts, for EVERY container
  # on the host. No per-service config needed.
  - job_name: cadvisor
    static_configs:
      - targets: ["observability-cadvisor:8080"]

  # Host (mini PC) metrics: CPU, RAM, disk, load, temperature.
  - job_name: node-exporter
    static_configs:
      - targets: ["observability-node-exporter:9100"]

  # Application /metrics endpoints, discovered from the Docker socket. A service
  # opts in with these labels on its compose service:
  #     prometheus.io/scrape:   "true"
  #     prometheus.io/hostport: "<published host port>"
  #     prometheus.io/path:     "/metrics"   (optional, defaults to /metrics)
  #     environment:            "production" | "staging"
  # Prometheus reaches the endpoint through the host's published port
  # (host.docker.internal), so no shared Docker network is required.
  - job_name: docker-apps
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_docker_container_label_prometheus_io_hostport]
        regex: (.+)
        replacement: host.docker.internal:$1
        target_label: __address__
      - source_labels: [__meta_docker_container_label_prometheus_io_path]
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: compose_project
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_label_environment]
        target_label: environment
