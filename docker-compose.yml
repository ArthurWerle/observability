# Central observability stack (Grafana + Loki + Prometheus).
#
# One Portainer stack that gives a single pane of glass over every other
# container on this host:
#   - Logs   : Alloy auto-discovers ALL containers via the Docker socket and
#              ships their logs to Loki. Nothing to configure per service.
#   - Metrics: Prometheus scrapes host + per-container infra metrics
#              (node-exporter, cAdvisor) plus any service that opts in with
#              `prometheus.io/*` labels (see README).
#   - Alerts : Grafana unified alerting e-mails critical failures.
#
# Everything stays on the LAN. Deploy: copy .env.example -> .env, fill it in,
# then `docker compose up -d` (or add as a stack in Portainer).

services:
  grafana:
    image: grafana/grafana:11.4.0
    container_name: observability-grafana
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # SMTP (Gmail). Requires a Google "App Password" (2FA accounts cannot use
      # the normal password). See README.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com:587}
      GF_SMTP_USER: ${SMTP_USER}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
      GF_SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Homelab Grafana}
      GF_SMTP_STARTTLS_POLICY: "MandatoryStartTLS"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
      - prometheus
    networks:
      - observability

  loki:
    image: grafana/loki:3.3.2
    container_name: observability-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - observability

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: observability-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    networks:
      - observability

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: observability-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Lets Prometheus reach every service's /metrics through the host's
    # published port, so no app network wiring is needed to add a service.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - observability

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: observability-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - observability

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: observability-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - observability

volumes:
  grafana_data:
  loki_data:
  prometheus_data:
  alloy_data:

networks:
  observability:
    driver: bridge
